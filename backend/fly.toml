app = "mindsphere-mental-health-assistant"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Disable autoscaling + ensure a SINGLE VM because free tier cannot run 2
[deploy]
  strategy = "immediate"

[machines]
  auto_start = true
  auto_stop = true
  min_machines_running = 1
  max_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
