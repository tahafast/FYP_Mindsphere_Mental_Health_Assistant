# MindSphere Backend - Fly.io Configuration
# Updated for Fly Machines (v2)

app = "mindsphere-mental-health-assistant"
primary_region = "sin"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
