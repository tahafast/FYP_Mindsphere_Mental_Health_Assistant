app = "mindsphere-backend"
primary_region = "sin"  # Singapore region, change if needed

[build]

[env]
  PORT = "8080"

[[services]]
  internal_port = 8080
  processes = ["app"]

  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "20s"

[experimental]
  allowed_public_ports = []
  auto_rollback = true
