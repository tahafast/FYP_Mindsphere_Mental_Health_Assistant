app = "mindsphere-mental-health-assistant"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "120s"
    path = "/"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
